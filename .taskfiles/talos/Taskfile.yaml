---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:

  generate-config:
    desc: Render Talos machine configs to talos/output
    dir: '{{.TALOS_DIR}}'
    cmd: topf render --output output
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  talosconfig:
    desc: Regenerate the talosctl client config
    dir: '{{.TALOS_DIR}}'
    cmd: topf talosconfig > talosconfig
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  diff:
    desc: Diff rendered config against live nodes [HOST=optional regex]
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --dry-run {{if .HOST}}--nodes-filter '{{.HOST}}'{{end}}
    preconditions:
      - test -f {{.TALOSCONFIG}}
      - which topf

  apply-node:
    desc: Apply Talos config to a node [HOST=required regex]
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --nodes-filter '{{.HOST}}'
    requires:
      vars: [HOST]
    preconditions:
      - test -f {{.TALOSCONFIG}}
      - which topf

  schematic-ids:
    desc: Print the resolved Image Factory schematic IDs
    dir: '{{.TALOS_DIR}}'
    cmd: topf schematic-ids
    preconditions:
      - which topf

  reset:
    desc: Resets nodes back to maintenance mode
    dir: '{{.TALOS_DIR}}'
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: topf reset --graceful=false --full={{.CLI_FORCE}}
    preconditions:
      - which topf
