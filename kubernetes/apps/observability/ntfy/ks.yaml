---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ntfy
  namespace: &namespace observability
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  # Deliberately does NOT depend on tailscale-operator. Without the operator the
  # Service still works in-cluster, so gatus and Alertmanager keep their sink;
  # only the phone's tailnet subscription is missing. Alerting degrades rather
  # than disappearing.
  dependsOn:
    - name: longhorn
      namespace: storage
  path: ./kubernetes/apps/observability/ntfy/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
