---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy: ['alertname', 'job']
    groupWait: 1m
    groupInterval: 10m
    repeatInterval: 12h
    receiver: ntfy
    routes:
      - receiver: 'null'
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      # Watchdog fires constantly by design; its *absence* is the signal, and
      # nothing inside this cluster can observe its own silence. That dead-man's
      # switch now lives at tower, whose gatus probes this cluster over the
      # tailnet — so an outage here is reported by a box the outage cannot take
      # down. Dropping it locally keeps the phone quiet.
      - receiver: 'null'
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
  inhibitRules:
    - equal: ['alertname', 'namespace']
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
  receivers:
    - name: 'null'
    - name: ntfy
      # ntfy-alertmanager renders the webhook into a readable notification and
      # publishes it to this cluster's own ntfy. Entirely in-cluster: the alert
      # path never touches envoy or the Cloudflare Tunnel, so a tunnel outage
      # cannot silence the alert about the tunnel outage.
      webhookConfigs:
        - url: http://ntfy-alertmanager.observability.svc.cluster.local:8080/
          sendResolved: true
