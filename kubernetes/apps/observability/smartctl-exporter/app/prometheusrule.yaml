---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl-exporter-rules
spec:
  groups:
    - name: smartctl-exporter.rules
      rules:
        - alert: SmartDeviceHighTemperature
          expr: smartctl_device_temperature{temperature_type="current"} > 65
          for: 5m
          annotations:
            summary: Drive {{ $labels.device }} on {{ $labels.instance }} is above 65°C
          labels:
            severity: critical
        - alert: SmartDeviceTestFailed
          # QEMU virtual disks report no SMART
          expr: |-
            (smartctl_device_smart_status != 1 or smartctl_device_status != 1)
            unless on (instance, device) smartctl_device{model_name=~"QEMU.*"}
          for: 5m
          annotations:
            summary: Drive {{ $labels.device }} on {{ $labels.instance }} failed its SMART check
          labels:
            severity: critical
        - alert: SmartDeviceCriticalWarning
          expr: smartctl_device_critical_warning != 0
          for: 5m
          annotations:
            summary: Drive {{ $labels.device }} on {{ $labels.instance }} reports a critical warning
          labels:
            severity: critical
        - alert: SmartDeviceMediaErrors
          expr: smartctl_device_media_errors != 0
          for: 5m
          annotations:
            summary: Drive {{ $labels.device }} on {{ $labels.instance }} has media errors
          labels:
            severity: critical
        - alert: SmartDeviceAvailableSpareUnderThreshold
          expr: smartctl_device_available_spare_threshold > smartctl_device_available_spare
          for: 5m
          annotations:
            summary: Drive {{ $labels.device }} on {{ $labels.instance }} is under its spare threshold
          labels:
            severity: critical
        - alert: SmartDeviceErrorLogIncreased
          expr: increase(smartctl_device_num_err_log_entries[1h]) > 0
          annotations:
            summary: Drive {{ $labels.device }} on {{ $labels.instance }} logged new NVMe errors
          labels:
            severity: warning
