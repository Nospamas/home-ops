---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app etcd-defrag
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      *app:
        type: cronjob
        cronjob:
          schedule: '30 3 * * 0'
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        # One member at a time; defrag blocks that member.
        initContainers:
          ctrl-01: &defrag
            image:
              repository: ghcr.io/siderolabs/talosctl
              tag: v1.13.12@sha256:9c68c786022cfa4da7672c6379e9b217c2593034ee52be1ff5bd73d6ed8e0131
            args: ['--nodes', '192.168.0.1', 'etcd', 'defrag']
            env:
              TALOSCONFIG: /var/run/secrets/talos.dev/config
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ['ALL'] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
          ctrl-02:
            <<: *defrag
            args: ['--nodes', '192.168.0.2', 'etcd', 'defrag']
        containers:
          ctrl-03:
            <<: *defrag
            args: ['--nodes', '192.168.0.3', 'etcd', 'defrag']
    defaultPodOptions:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    persistence:
      talos:
        type: secret
        name: etcd-defrag-talosconfig
        globalMounts:
          - path: /var/run/secrets/talos.dev
            readOnly: true
