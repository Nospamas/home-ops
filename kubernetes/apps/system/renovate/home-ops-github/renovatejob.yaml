apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  annotations:
  name: renovate-github
  namespace: renovate-operator
spec:
  schedule: 0 * * * *
  discoveryFilters:
    - nospamas/home-ops
    - nospamas/unraid-ops
  provider:
    name: github
  extraEnv:
    - name: RENOVATE_ALLOW_PLUGINS
      value: "true"
    # - name: RENOVATE_LOG_LEVEL
    #   value: debug
    # Persist lookup caches between runs; all globalOnly, so they live here.
    - name: RENOVATE_CACHE_DIR
      value: /cache
    - name: RENOVATE_REPOSITORY_CACHE
      value: enabled
    # Only these four default to 30m; the other docker namespaces cache longer.
    - name: RENOVATE_CACHE_TTL_OVERRIDE
      value: >-
        {"datasource-docker-tags": 1440, "datasource-docker-hub-tags": 1440,
        "datasource-docker-releases-v2": 1440, "datasource-docker-digest": 1440}
    # Stale-on-error retention; == the upstream default, pinned.
    - name: RENOVATE_CACHE_HARD_TTL_MINUTES
      value: "10080"
    # lscr.io pages oldest-first and is capped by this
    - name: RENOVATE_DOCKER_MAX_PAGES
      value: "100"
  extraVolumes:
    - name: cache
      persistentVolumeClaim:
        claimName: renovate-cache
  extraVolumeMounts:
    - name: cache
      mountPath: /cache
  image: ghcr.io/renovatebot/renovate:44.5.3
  parallelism: 5
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  # The operator mints an installation token from the App and injects it as
  # RENOVATE_TOKEN, refreshing it when under 30m TTL. No PAT for the platform.
  githubAppReference:
    secretName: renovate-github-app
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
  # Still carries GITHUB_COM_TOKEN: an installation token can't read changelogs
  # from third-party public repos, so that one stays a (scopeless) PAT.
  secretRef: renovate-secret