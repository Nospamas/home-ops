---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: renovate-cache
spec:
  # RWX: the operator runs discovery plus one pod per repo, unpinned.
  accessModes: ['ReadWriteMany']
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn-ultra-fast
