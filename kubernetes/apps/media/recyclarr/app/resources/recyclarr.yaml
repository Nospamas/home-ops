---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
#
# No `media_naming` block, deliberately: renaming is enabled in both apps, so anything set
# here moves files on disk. Naming stays hand-managed in the UI.
#
# A quality profile given by trash_id imports that profile's whole custom-format set and score
# set from the guide. The `custom_formats` blocks below are overrides on top of that import,
# not the full list — which is why SQP-1's `minFormatScore: 1000` is reachable.

sonarr:
  series:
    base_url: http://sonarr.media.svc.cluster.local
    api_key: !env_var SONARR_API_KEY

    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    quality_definition:
      type: series

    quality_profiles:
      # WEB 2160p, falling back to WEB 1080p. Excludes remux by design.
      - trash_id: &web-2160p c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true

    custom_formats:
      # Both x265 formats are scoped `Not 2160p` and so never fire on 4K. Softening the guide's
      # -10000 only affects the 1080p fallback tier, where it keeps x265 deprioritised rather
      # than rejected outright (this profile's minFormatScore is 0).
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
          - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
        assign_scores_to:
          - trash_id: *web-2160p
            score: -100

      - trash_ids:
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
        assign_scores_to:
          - trash_id: *web-2160p
            score: -200

      # No `score` key — keeps the guide's default.
      - trash_ids:
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140 # Retags
        assign_scores_to:
          - trash_id: *web-2160p

radarr:
  movies:
    base_url: http://radarr.media.svc.cluster.local
    api_key: !env_var RADARR_API_KEY

    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    quality_definition:
      type: sqp-uhd

    quality_profiles:
      # Bluray-2160p, then WEB 2160p, then 1080p. SQP excludes remux by design.
      - trash_id: &sqp-1-2160p 5128baeb2b081b72126bc8482b2a86a0 # [SQP] SQP-1 (2160p)
        reset_unmatched_scores:
          enabled: true

    custom_formats:
      # The sqp-1-2160p score set gives 10bit -10000. 4K HDR is inherently 10-bit and encode
      # groups advertise it in release titles, so that would reject the encodes this profile
      # exists to find.
      - trash_ids:
          - a5d148168c4506b55cf53984107c396e # 10bit
        assign_scores_to:
          - trash_id: *sqp-1-2160p
            score: 0

      # `Not 2160p` scoped — affects only the 1080p fallback tier. See the sonarr block above.
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
          - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
        assign_scores_to:
          - trash_id: *sqp-1-2160p
            score: -100

      - trash_ids:
          - cae4ca30163749b891686f95532519bd # AV1
        assign_scores_to:
          - trash_id: *sqp-1-2160p
            score: -200

      # No `score` key — keeps the guide's default.
      - trash_ids:
          - 957d0f44b592285f26449575e8b1167e # Special Edition
          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
          - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
          - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
          - f537cf427b64c38c8e36298f657e4828 # Scene
        assign_scores_to:
          - trash_id: *sqp-1-2160p
