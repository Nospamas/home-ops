---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      home-assistant:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "iot",
                "namespace": "network",
                "ips": ["${IP_IOT_HOME_ASSISTANT}/16", "${IP6_IOT_HOME_ASSISTANT}/64"]
              }]
        initContainers:
          seed-http:
            image: &image
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.9.1@sha256:1bcf770d15bd91a55491d04f12494febb35da68b025e1f6612a167a2e190a8c7
            command: ["/bin/sh", "/seed/seed-http.sh"]
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
        containers:
          app:
            image: *image
            env:
              TZ: ${CLUSTER_TIMEZONE}
              HOME_ASSISTANT__HACS_INSTALL: "true"
              HASS_RECORDER_DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-postgres
                    key: url
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 4Gi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.133.0@sha256:e073a441c61c85821a7f16b64cf93b4e77b4092899bb1f3bed906fbd558afd62
            env:
              TZ: ${CLUSTER_TIMEZONE}
            args:
              - --auth
              - none
              - --user-data-dir
              - /config/.vscode
              - --extensions-dir
              - /config/.vscode
              - --port
              - "12321"
              - /config
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 4Gi

    service:
      app:
        controller: home-assistant
        type: LoadBalancer
        ipFamilyPolicy: SingleStack
        ipFamilies:
          - IPv4
        annotations:
          lbipam.cilium.io/ips: "${IP_SVC_HOME_ASSISTANT}, ${IP6_SVC_HOME_ASSISTANT}"
        ports:
          http:
            port: 8123
            primary: true
      code:
        controller: home-assistant
        type: LoadBalancer
        ipFamilyPolicy: SingleStack
        ipFamilies:
          - IPv4
        annotations:
          lbipam.cilium.io/ips: "${IP_SVC_HOME_ASSISTANT_CODE}, ${IP6_SVC_HOME_ASSISTANT_CODE}"
        ports:
          code-server:
            port: 12321

    route:
      app:
        hostnames:
          - hass.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/name: Home Assistant
          gethomepage.dev/group: Home
          gethomepage.dev/icon: home-assistant.svg
          gethomepage.dev/description: Home Automation
          gethomepage.dev/widget.type: homeassistant
          gethomepage.dev/widget.url: http://home-assistant-app.self-hosted.svc.cluster.local:8123
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_HOMEASSISTANT_TOKEN}}" }}'
          gethomepage.dev/pod-selector: app.kubernetes.io/name=home-assistant
      code-server:
        hostnames:
          - hass-code.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: code
                port: code-server

    persistence:
      config:
        type: configMap
        name: home-assistant-configmap
        advancedMounts:
          home-assistant:
            seed-http:
              - path: /seed/http.json
                subPath: http.json
                readOnly: true
              - path: /seed/seed-http.sh
                subPath: seed-http.sh
                readOnly: true
            app: &config-mount
              - path: /config/configuration.yaml
                subPath: configuration.yaml
            code-server: *config-mount
      data:
        existingClaim: *app
        advancedMounts:
          home-assistant:
            seed-http: &data-mount
              - path: /config
            app: *data-mount
            code-server: *data-mount
      cache:
        size: 2Gi
        accessMode: ReadWriteOnce
        storageClass: longhorn-fast
        suffix: cache
        advancedMounts:
          home-assistant:
            app:
              - path: /config/.venv
                subPath: venv
            code-server:
              - path: /config/.venv
                subPath: venv
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
            subPath: logs
          - path: /config/tts
            subPath: tts
          - path: /tmp
            subPath: tmp
