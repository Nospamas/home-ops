---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tailscale
components:
  - ../../components/common
resources:
  - ./tailscale-operator/ks.yaml
patches:
  # The operator's proxy Pods need NET_ADMIN and /dev/net/tun to program their
  # own netfilter rules, which the cluster-default `baseline` PSA level forbids.
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          pod-security.kubernetes.io/enforce: "privileged"
          pod-security.kubernetes.io/audit: "privileged"
          pod-security.kubernetes.io/warn: "privileged"
    target:
      kind: Namespace